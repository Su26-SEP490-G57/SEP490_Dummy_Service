services:
  his-staging:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: his-staging
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: his-postgres
      DB_PORT: 5432
      DB_USER: his_staging
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: his_staging
    networks:
      # his-staging: private link to his-postgres
      # poms-staging: lets poms-api-staging and poms-nginx reach this service as his-staging:4000
      - his-staging
      - poms-staging
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:4000/api || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  his-staging:
    external: true
  poms-staging:
    external: true
