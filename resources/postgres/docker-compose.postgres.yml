services:
  his-postgres:
    image: postgres:16-alpine
    container_name: his-postgres
    environment:
      POSTGRES_USER: his_root_admin
      POSTGRES_PASSWORD: ${SUPER_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - his_postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - his-dev
      - his-staging
      - his-prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  his-dev:
    external: true
  his-staging:
    external: true
  his-prod:
    external: true

volumes:
  his_postgres_data:
